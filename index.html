window.freeRide=()=>{rally=null;close();notify('Explora, recoge monedas y visita el garaje.');};
window.chooseContracts=()=>{if(rally){notify('Termina el rally primero.');return}if(mission){open('contracts',panelHead('Contrato activo')+`<div class="sub">${mission.term} · ${terms[mission.term].title}</div><button class="big" onclick="closePanel()">Continuar ruta</button><button class="big secondary" onclick="cancelContract()">Abandonar contrato</button>`);return}open('contracts',panelHead('Tablero de encargos')+'<div class="sub">Elige una carga y sal a la calle.</div><div class="contracts">'+Object.entries(terms).map(([k,t])=>`<button class="contract ${['EXW','CIP'].includes(k)?'feature':''}" onclick="startContract('${k}')"><span class="badge">${k==='EXW'?'🏭 PRINCIPAL':k==='CIP'?'⛈ PRINCIPAL':'CONTRATO'}</span><b>${k}</b><strong style="font-size:12px">${t.title}</strong><small>${t.cargo}</small><em>+ ${fmt(t.reward)}</em></button>`).join('')+'</div><div class="footnote">Contratos ficticios inspirados en Incoterms® 2020. Todos los importes del juego están en bolivianos.</div>')};
window.cancelContract=()=>{mission=null;player.health=100;rain=false;close();notify('Contrato abandonado. Puedes aceptar otro.');hud()};
window.startContract=term=>{rally=null;fuelNav=false;let t=terms[term];mission={term,idx:0,loaded:false,risk:'Vendedor',insurance:false,expense:{Comprador:0,Vendedor:0},log:[],damage:0,coveredDamage:0,recovered:0,claimed:0,collect:0,start:clock,storm:false,claimReturn:false};player.health=100;rain=false;close();notify(term+' · '+t.cargo+' · Ve a la fábrica');beep(660,.2,'triangle');hud()};
function targetKey(){return mission?(mission.claimReturn?'claim':terms[mission.term].route[mission.idx]):null}function target(){return rally?rally.points[rally.idx]||null:sites[targetKey()]||null}function navKey(){return fuelNav&&!rally?'fuel':targetKey()}function navTarget(){return fuelNav&&!rally?sites.fuel:target()}function addLog(s){if(mission)mission.log.unshift(s)}function cost(payer,amount,why){if(!mission)return;mission.expense[payer]+=amount;addLog(payer+' − '+fmt(amount)+' · '+why);floating(player.x,player.y-40,'− '+fmt(amount)+' '+payer,'#ffca83');beep(260,.13,'triangle')}
function riskTransfer(reason){if(mission.risk==='Comprador')return;mission.risk='Comprador';addLog('⚑ Riesgo → Comprador · '+reason);notify('⚑ Riesgo transferido al comprador');burst(player.x,player.y,'#ffd57e');beep(810,.22,'triangle')}
function advance(){mission.idx++;if(mission.idx>=terms[mission.term].route.length){finish();return}hud();let s=target();notify('Siguiente parada: '+s.name);beep(680,.1,'triangle')}
const actionLabels={factory:'Cargar las cajas',insurance:'Activar póliza',terminal:'Despacho al transportista',export:'Liberar exportación',import:'Liberar importación',destination:'Descargar mercancía',claim:'Cobrar indemnización'};
function atSite(){return Object.entries(sites).sort((a,b)=>d(player,a[1])-d(player,b[1]))[0]}
function interact(){if(overlay)return;if(rally){if(d(player,sites.fuel)<92){refuel();return}notify('🏁 Cruza los aros antes de que termine el tiempo.');return}let [key,s]=atSite();if(d(player,s)>92){notify('Acércate a una estación o al marcador.');return}if(key===targetKey()){let t=terms[mission.term];switch(key){case 'factory':if(mission.term==='EXW')riskTransfer('Carga disponible sin cargar');loadMini(false);break;case 'insurance':insurancePanel();break;case 'terminal':cost(t.freight,t.fee,'Flete contratado');if(['FCA','CIP','CPT'].includes(mission.term))riskTransfer('Entrega al transportista');addLog('🚛 Transportista recibió la mercancía');advance();if(mission?.term==='CIP'&&!mission.storm){mission.storm=true;rain=true;notify('⛈ Tormenta en la ruta: conduce con cuidado');}break;case 'export':stampMini('export');break;case 'import':stampMini('import');break;case 'destination':if(['DAP','DDP'].includes(mission.term))riskTransfer('Destino, listo para descargar');loadMini(true);break;case 'claim':claimPay();break;}return}if(key==='garage'){garage();return}if(key==='fuel'){refuel();return}if(key==='insurance'&&mission?.term==='EXW'&&!mission.insurance&&!mission.loaded){insurancePanel(true);return}if(key==='claim'&&mission?.insurance&&mission.coveredDamage>mission.claimed){claimPay();return}notify(mission?'Sigue el marcador dorado.':'Elige un encargo en 📋 o visita el garaje.')}
function insurancePanel(optional=false){let m=mission,t=terms[m.term],premium=Math.round(t.price*.03);open('insurance',panelHead('🛡 Póliza de carga')+`<div class="sub">${optional?'Cobertura voluntaria del comprador.':'La empresa vendedora paga la póliza CIP.'}</div><div class="rowstat"><span>Valor de mercancía</span><b>${fmt(t.price)}</b></div><div class="rowstat"><span>Cobertura del 110 %</span><b>${fmt(t.price*1.1)}</b></div><div class="rowstat"><span>Prima · ${optional?'Comprador':'Vendedor'}</span><b>${fmt(premium)}</b></div><div class="rowstat"><span>Tipo de cobertura</span><b>ICC (A)</b></div><button class="big" onclick="activatePolicy(${optional},${premium})">🛡 Activar cobertura</button><div class="footnote">En esta simulación, la póliza cubre los daños del trayecto una vez transferido el riesgo. Las pólizas reales tienen condiciones y exclusiones.</div>`)}
window.activatePolicy=(optional,premium)=>{if(!mission||mission.insurance)return;mission.insurance=true;cost(optional?'Comprador':'Vendedor',premium,'Seguro de carga');close();notify('🛡 Póliza activa · '+fmt(terms[mission.term].price*1.1));fanfare();if(!optional)advance();hud()};
function stampMini(key){let t=terms[mission.term],payer=key==='export'?t.exp:t.imp,amount=key==='export'?180:420;open('stamp',panelHead(key==='export'?'Control de salida':'Control de entrada')+`<div class="sub">Arrastra el sello hasta el círculo del documento.</div><div id="stampArea" style="height:190px;position:relative;border-radius:15px;background:#24484f;touch-action:none;overflow:hidden"><div style="position:absolute;right:9%;top:18px;width:45%;height:150px;background:#f5ead1;border-radius:8px;color:#305052;padding:13px;font-size:12px;box-shadow:0 4px 0 #b3a58a"><b>MANIFIESTO</b><hr> Carga: ${t.cargo}<br> ${payer}: ${fmt(amount)}<div id="sealTarget" style="position:absolute;bottom:10px;right:14px;width:55px;height:55px;border:2px dashed #b98664;border-radius:50%;display:grid;place-items:center;color:#c79774">✓</div></div><div id="stamp" role="button" tabindex="0" aria-label="Sello aduanero" style="position:absolute;left:11%;top:60px;width:68px;height:68px;background:#e5b46a;border:4px solid #fbe1a5;border-radius:50%;color:#493a34;display:grid;place-items:center;font-size:32px;box-shadow:0 6px 0 #936342;touch-action:none;cursor:grab">✓</div></div><div class="footnote">También puedes tocar el sello y después el círculo.</div>`);let stamp=$('stamp'),area=$('stampArea'),dest=$('sealTarget'),selected=false,stamped=false;const done=()=>{if(!mission||modalType!=='stamp'||stamped)return;stamped=true;dest.style.background='#89c8a7';dest.style.color='#214d42';dest.style.border='3px solid #438b69';stamp.style.visibility='hidden';cost(payer,amount,key==='export'?'Despacho de exportación':'Despacho de importación');beep(750,.18,'triangle');setTimeout(()=>{if(modalType!=='stamp')return;close();advance()},350)};let dragging=false;stamp.onpointerdown=e=>{e.preventDefault();stamp.setPointerCapture(e.pointerId);dragging=true;selected=true;stamp.style.borderColor='#fff'};stamp.onpointermove=e=>{if(!dragging)return;const r=area.getBoundingClientRect();stamp.style.left=(e.clientX-r.left-34)+'px';stamp.style.top=(e.clientY-r.top-34)+'px'};stamp.onpointerup=e=>{dragging=false;const r=dest.getBoundingClientRect();if(e.clientX>r.left-25&&e.clientX<r.right+25&&e.clientY>r.top-25&&e.clientY<r.bottom+25)done();else{stamp.style.left='11%';stamp.style.top='60px'}};dest.onclick=()=>{if(selected)done()};stamp.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();done()}}}
function loadMini(unload){let t=terms[mission.term];open('load',`<div class="paneltop"><h2>${unload?'¡Última descarga!':'¡A cargar!'}</h2><span class="tag" id="loadCount">0/4</span></div><div class="sub">Arrastra las cajas ${unload?'al almacén':'al camión'} o toca cada caja. ${unload?'':'Carga: '+t.cargo}</div><div class="loadingarea"><canvas id="loadCanvas" width="440" height="226"></canvas></div><div class="footnote">${unload?'Estaciona y entrega tus cuatro cajas.':'Operación de carga a cargo del '+t.loading.toLowerCase()+'.'}</div>`);const c=$('loadCanvas'),g=c.getContext('2d');let crates=[0,1,2,3].map(i=>({x:unload?275+(i%2)*39:45+(i%2)*50,y:55+Math.floor(i/2)*48,done:false})),drag=null,count=0;const dst=unload?{x:16,y:25,w:180,h:175}:{x:235,y:25,w:185,h:175};function draw(){g.clearRect(0,0,440,226);g.fillStyle='#294c50';g.fillRect(0,0,440,226);g.fillStyle='#436b68';g.fillRect(10,18,190,188);g.strokeStyle='#76a79b';g.lineWidth=2;g.strokeRect(10,18,190,188);g.fillStyle='#e4c88c';g.font='bold 13px system-ui';g.fillText('ALMACÉN',24,38);g.fillStyle='#b39b69';g.fillRect(235,24,145,179);g.fillStyle='#203c43';g.fillRect(242,35,130,150);g.fillStyle='#6cbaa7';g.fillRect(381,65,45,96);g.fillStyle='#c4e4df';g.fillRect(390,76,26,74);g.fillStyle='#d9e8d1';g.fillText('CAMIÓN',260,19);g.strokeStyle='#9ee0ac';g.lineWidth=3;g.setLineDash([7,5]);g.strokeRect(dst.x,dst.y,dst.w,dst.h);g.setLineDash([]);for(let i=0;i<4;i++){let b=crates[i],x=b.x,y=b.y;g.fillStyle='#1a30364f';g.fillRect(x+3,y+4,33,33);g.fillStyle=b.done?'#90d7a4':'#e6b466';g.fillRect(x,y,33,33);g.strokeStyle='#a77342';g.strokeRect(x,y,33,33);g.fillStyle='#f5dda3';g.fillRect(x+13,y,7,33);g.fillStyle='#79563c';g.font='bold 11px system-ui';g.fillText(b.done?'✓':'↑',x+12,y+23)}}function place(b){if(b.done)return;b.done=true;b.x=dst.x+38+(count%2)*45;b.y=dst.y+35+Math.floor(count/2)*48;count++;$('loadCount').textContent=count+'/4';beep(480+count*100,.13,'triangle');draw();if(count===4){setTimeout(()=>{if(modalType!=='load')return;close();if(unload){advance()}else{mission.loaded=true;cost(t.loading,120,'Carga de mercancía');advance()}},400)}}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*440/r.width,y:(e.clientY-r.top)*226/r.height}}c.onpointerdown=e=>{let p=pos(e);let b=crates.find(b=>!b.done&&p.x>b.x-8&&p.x<b.x+41&&p.y>b.y-8&&p.y<b.y+41);if(b){c.setPointerCapture(e.pointerId);drag={b,ox:b.x,oy:b.y,start:p}}};c.onpointermove=e=>{if(!drag)return;let p=pos(e);drag.b.x=p.x-16;drag.b.y=p.y-16;draw()};c.onpointerup=e=>{if(!drag)return;let p=pos(e),b=drag.b;if((p.x>dst.x&&p.x<dst.x+dst.w&&p.y>dst.y&&p.y<dst.y+dst.h)||d(p,drag.start)<8)place(b);else{b.x=drag.ox;b.y=drag.oy;draw()}drag=null};c.onpointercancel=()=>{if(drag){drag.b.x=drag.ox;drag.b.y=drag.oy;drag=null;draw()}};draw()}
function claimPay(){let m=mission;if(!m||!m.insurance||m.coveredDamage<=m.claimed){notify('No hay daños cubiertos pendientes.');return}let paid=m.coveredDamage-m.claimed;m.claimed=m.coveredDamage;m.recovered+=paid;addLog('🛡 Aseguradora → comprador + '+fmt(paid));m.claimReturn=false;notify('🛡 Indemnización al comprador: '+fmt(paid));floating(player.x,player.y-30,'+'+fmt(paid),'#9be9be');fanfare();burst(player.x,player.y,'#a9e5b4',25);hud()}
function finish(){let m=mission,t=terms[m.term],stars=player.health>=90?3:player.health>=65?2:1,bonus=stars*100,reward=t.reward+bonus;save.money+=reward;save.xp+=100+stars*25;save.done++;save.best[m.term]=Math.max(save.best[m.term]||0,stars);persist();let pending=m.insurance?m.coveredDamage-m.claimed:0;let loss=m.damage-m.recovered;let details=`<div class="rowstat"><span>Tu comisión + bonus</span><b>+ ${fmt(reward)}</b></div><div class="rowstat"><span>Costos del comprador</span><b>${fmt(m.expense.Comprador)}</b></div><div class="rowstat"><span>Costos del vendedor</span><b>${fmt(m.expense.Vendedor)}</b></div><div class="rowstat"><span>Daños de mercancía</span><b>${fmt(m.damage)}</b></div><div class="rowstat"><span>Indemnización pagada</span><b>${fmt(m.recovered)}</b></div>${pending?`<div class="rowstat"><span>Indemnización pendiente</span><b>${fmt(pending)}</b></div>`:''}<div class="rowstat"><span>Daño aún no recuperado</span><b>${fmt(loss)}</b></div>`;mission=null;rain=false;open('finish',`<div class="titlebrand">CONTRATO ${m.term} COMPLETADO</div><div class="stars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><h2 style="text-align:center">¡Entrega lograda!</h2><div class="sub" style="text-align:center">${t.cargo} · ${Math.round(player.health)} % de integridad</div>${details}<button class="big" onclick="chooseContracts()">Siguiente contrato →</button><button class="big secondary" onclick="freeRide()">Volver a la ciudad</button><details style="margin-top:14px"><summary style="font-size:12px;color:#a7d0bf;cursor:pointer">Ver movimientos del contrato</summary><div class="log">${m.log.map(s=>'<div>'+s+'</div>').join('')}</div></details>`);fanfare();celebrate();hud()}
function celebrate(){let root=$('confetti');root.innerHTML='';for(let i=0;i<42;i++){let e=document.createElement('i');e.style.left=rand(0,100)+'%';e.style.background=['#f5d074','#9fe5b9','#ed9d85','#92c8df'][i%4];e.style.setProperty('--dx',rand(-120,120)+'px');e.style.animationDelay=rand(0,.5)+'s';root.appendChild(e)}setTimeout(()=>root.innerHTML='',2300)}

function shuffleFuel(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextFuelQuestion(){if(!fuelBag.length)fuelBag=shuffleFuel(fuelQuestions);if(mission&&['EXW','CIP'].includes(mission.term)&&Math.random()<.72){let i=fuelBag.findIndex(q=>q[0]===mission.term);if(i>=0)return fuelBag.splice(i,1)[0]}return fuelBag.shift()}
